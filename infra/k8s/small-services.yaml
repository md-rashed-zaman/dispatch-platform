# Redis (cache and rate limits, nothing to keep), SeaweedFS (S3 API for photos) and Mailpit (catches email).
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8.8.4-alpine
          args: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
          ports:
            - { containerPort: 6379 }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      enableServiceLinks: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.51
          args: [server, -dir=/data, -s3, -s3.port=8333, -s3.config=/etc/seaweedfs/s3.json]
          ports:
            - { containerPort: 8333 }
          readinessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: config
          secret: { secretName: seaweedfs-s3 } # infra/compose/seaweedfs/s3.json: local keys only
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  type: NodePort
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: inbox, port: 8025, nodePort: 30025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.33.1
          ports:
            - { containerPort: 1025 }
            - { containerPort: 8025 }
          readinessProbe:
            exec: { command: [/mailpit, readyz] }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 128Mi }
