# Keycloak in dev mode with the dispatch realm imported at start (the ConfigMap keycloak-realm is made from
# infra/compose/keycloak/dispatch-realm.json by scripts/k8s-up.sh). Its data lives in the pod: a restart resets the
# realm, as in compose. The issuer is pinned to http://localhost:8180 (NodePort 30180, mapped by kind), so tokens
# from the host and the browser carry the issuer the app expects; the app fetches keys at http://keycloak:8180.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8180, nodePort: 30180 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      enableServiceLinks: false
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2
          args: [start-dev, --import-realm]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            - { name: KC_HTTP_PORT, value: "8180" }
            - { name: KC_HOSTNAME, value: "http://localhost:8180" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=60" }
          ports:
            - { containerPort: 8180 }
            - { containerPort: 9000, name: management }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 640Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
