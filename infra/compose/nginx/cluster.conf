# Load balancer for the "cluster" profile: two app instances behind http://localhost:8088.
events {}

http {
  upstream dispatch {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
  }

  server {
    listen 8088;

    location / {
      proxy_pass http://dispatch;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Server-sent events: pass each event through at once, and keep quiet streams open (keep-alive is 20 s).
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
