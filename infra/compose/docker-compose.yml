# Local stack. Services are added as steps need them (Keycloak at 1.2, storage at 1.7, Kafka and Redis in Phase 2).
# Memory limits keep the stack usable on an 8 GB laptop.
name: dispatch

services:
  postgres:
    build: ./postgres
    image: dispatch-postgres:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider. start-dev keeps data in the container (H2), so recreating it resets the realm
  # to keycloak/dispatch-realm.json. Admin console: http://localhost:8180 (admin / admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
      # Pins the token issuer to this URL, whoever calls Keycloak (browser, app, container).
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    mem_limit: 768m
    healthcheck:
      # The image has no curl; ask the management port (9000) for readiness with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
