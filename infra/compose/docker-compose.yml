# Local stack. Services are added as steps need them (Keycloak at 1.2, SeaweedFS at 1.7, Kafka at 2.2, Redis later in Phase 2).
# Memory limits keep the stack usable on an 8 GB laptop.
name: dispatch

services:
  postgres:
    build: ./postgres
    image: dispatch-postgres:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider. start-dev keeps data in the container (H2), so recreating it resets the realm
  # to keycloak/dispatch-realm.json. Admin console: http://localhost:8180 (admin / admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
      # Pins the token issuer to this URL, whoever calls Keycloak (browser, app, container).
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    mem_limit: 768m
    healthcheck:
      # The image has no curl; ask the management port (9000) for readiness with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30

  # Object storage with the S3 API, for work order photos (T15). Same SDK calls as Amazon S3; only the
  # endpoint differs. Credentials come from seaweedfs/s3.json (local only). S3 API: http://localhost:8333
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
    volumes:
      - ./seaweedfs:/etc/seaweedfs:ro
      - seaweedfs-data:/data
    mem_limit: 256m
    healthcheck:
      # Any HTTP answer (anonymous requests get 403) means the S3 gateway is up. The image has wget, not curl;
      # 127.0.0.1 because localhost resolves to IPv6 in the container and the gateway listens on IPv4.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email the app sends (step 2.4): SMTP on 1025, inbox at http://localhost:8025. Nothing leaves
  # the machine.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"
      - "8025:8025"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Event broker for events leaving the service (step 2.2). KRaft mode: Kafka manages its own metadata, no
  # ZooKeeper. One broker is enough locally; topics get replication factor 1. From the host: localhost:9092.
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      # Clients on the host use localhost:9092; containers (Kafka UI) use kafka:19092.
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared by the app, never created by a typo
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # Browse topics and messages: http://localhost:8090. Optional, to save memory:
  #   docker compose -f infra/compose/docker-compose.yml --profile tools up -d kafka-ui
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["tools"]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

volumes:
  postgres-data:
  kafka-data:
  seaweedfs-data:
