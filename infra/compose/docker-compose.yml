# Local stack. Services are added as steps need them (Keycloak at 1.2, SeaweedFS at 1.7, Kafka and Redis in Phase 2).
# Memory limits keep the stack usable on an 8 GB laptop.
name: dispatch

services:
  postgres:
    build: ./postgres
    image: dispatch-postgres:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider. start-dev keeps data in the container (H2), so recreating it resets the realm
  # to keycloak/dispatch-realm.json. Admin console: http://localhost:8180 (admin / admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8180
      # Pins the token issuer to this URL, whoever calls Keycloak (browser, app, container).
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    mem_limit: 768m
    healthcheck:
      # The image has no curl; ask the management port (9000) for readiness with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30

  # Object storage with the S3 API, for work order photos (T15). Same SDK calls as Amazon S3; only the
  # endpoint differs. Credentials come from seaweedfs/s3.json (local only). S3 API: http://localhost:8333
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
    volumes:
      - ./seaweedfs:/etc/seaweedfs:ro
      - seaweedfs-data:/data
    mem_limit: 256m
    healthcheck:
      # Any HTTP answer (anonymous requests get 403) means the S3 gateway is up. The image has wget, not curl;
      # 127.0.0.1 because localhost resolves to IPv6 in the container and the gateway listens on IPv4.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  seaweedfs-data:
