# Defaults for the local kind cluster (scripts/k8s-up.sh). Another environment overrides these with -f or --set.

replicaCount: 2 # two, so a rolling update or a lost node never leaves nobody serving

image:
  repository: dispatch-app
  tag: local # scripts/k8s-up.sh sets the content tag of each build
  pullPolicy: Never # kind: the image is loaded into the node, never pulled

# A Secret made outside the chart (scripts/k8s-up.sh; in production, External Secrets or Sealed Secrets), so no
# password sits in values files or in Helm's release history. Its keys become environment variables:
# POSTGRES_USER, POSTGRES_PASSWORD, DB_APP_PASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY and, optionally, GEMINI_API_KEY.
existingSecret: dispatch-secrets

# Plain settings, as environment variables (application.yml reads each one, with a local default).
env:
  DB_URL: jdbc:postgresql://postgres:5432/dispatch
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  MAIL_HOST: mailpit
  S3_ENDPOINT: http://seaweedfs:8333
  # Tokens say http://localhost:8180 (what users reach); the app fetches Keycloak's keys inside the cluster.
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/dispatch
  KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/dispatch/protocol/openid-connect/certs
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs # one JSON object per line, for a log collector
  TRACING_SAMPLING_PROBABILITY: "0" # no collector in this cluster
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
  PAYMENTS_REQUIRED: "true" # technicians start only once the client has paid (Phase 4); the fake SSLCommerz takes it

service:
  type: NodePort
  port: 8080
  nodePort: 30080 # mapped to localhost:8080 by infra/kind/cluster.yaml

# Memory: request = limit, so the scheduler reserves what the JVM will use and the pod is never the first one
# evicted. The heap is half (512 MB); the app needs ~420 MB more outside it. At 640 Mi the pods were OOMKilled. CPU: a request but no limit; a CPU limit throttles the JIT and GC threads
# and slows startup, and the request alone already decides each pod's share when the node is busy.
resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 1Gi }

rollingUpdate:
  maxSurge: 1 # one new pod at a time
  maxUnavailable: 0 # an old pod leaves only once a new one is ready

# Before SIGTERM: keep serving while Kubernetes removes the pod from the Service's endpoints (they update
# asynchronously). Then graceful shutdown takes up to 20 s. 5 + 20 is inside the 30 s grace period.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

autoscaling:
  enabled: false # needs metrics-server; on, it replaces replicaCount
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1 # a node drain can't take both pods at once
