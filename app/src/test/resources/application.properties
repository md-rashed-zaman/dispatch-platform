# Tests verify tokens against a test-only public key instead of downloading Keycloak's (no Keycloak needed).
# jwk-set-uri is cleared so Spring Boot uses the public key; the issuer, audience and expiry checks still apply.
# The key pair in jwt/ is for tests only.
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:jwt/test-public.pem
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
