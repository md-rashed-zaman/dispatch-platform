# Tests verify tokens against a test-only public key instead of downloading Keycloak's (no Keycloak needed).
# jwk-set-uri is cleared so Spring Boot uses the public key; the issuer, audience and expiry checks still apply.
# The key pair in jwt/ is for tests only.
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:jwt/test-public.pem
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Most tests don't need Kafka: no relay, no consumer, and nothing tries to create topics on a broker that isn't there.
# Tests that do (OutboxRelayTests) import KafkaTestcontainersConfiguration, which switches both on.
dispatch.outbox.relay-enabled=false
dispatch.notification.consumer-enabled=false
# No mail server in tests unless a test brings one (EmailSenderTests).
dispatch.mail.sender-enabled=false
spring.kafka.admin.auto-create=false

# The SLA job runs only when a test calls it, and its lock is free right after a round.
dispatch.sla.initial-delay=P1D
dispatch.sla.lock-at-least-for=PT0S
# Nor does the embedding backfill: tests embed what they need, with a scripted model.
dispatch.matching.backfill.initial-delay=P1D

# No Redis unless a test brings one (RedisTestcontainersConfiguration): no cache, no rate limit.
spring.cache.type=none
dispatch.rate-limit.enabled=false
# Tests that stop Redis get the limiter back within a second of restarting it.
dispatch.rate-limit.redis-retry-after=PT1S

# Nothing to export to in tests (traces are still created, so trace-dependent code runs).
management.otlp.metrics.export.enabled=false
