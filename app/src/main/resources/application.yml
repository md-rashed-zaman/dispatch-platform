spring:
  application:
    name: dispatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dispatch}
    # Not the owner or a superuser, so row-level security applies to every query the app runs (ADR 0003).
    # Migration V4 creates this role; the app refuses to start as a role that bypasses the policies.
    username: dispatch_app
    password: ${DB_APP_PASSWORD:dispatch_app}
    hikari:
      # Wait at most 3 s for a connection, not the default 30: with the database down, requests fail fast with
      # 503 instead of piling up until every web thread is stuck (docs/failure-modes.md).
      connection-timeout: 3000
  flyway:
    # Migrations run as the schema owner. Only Flyway uses this account, never the app's own queries.
    user: ${POSTGRES_USER:dispatch}
    password: ${POSTGRES_PASSWORD:dispatch}
    placeholders:
      app-password: ${spring.datasource.password}
  modulith:
    events:
      # Events whose listener failed or never finished (crash, deploy) are delivered again on startup.
      # Every instance does this, so listeners must be safe to run twice (T16).
      republish-outstanding-events-on-restart: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # Fail in seconds, not minutes: the sender holds its rows while it waits.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms                  # a cache read waits at most this long for Redis before going to the database
      connect-timeout: 300ms
  cache:
    cache-names: technician-profiles  # created at startup, so their hit/miss metrics exist from the start
  kafka:
    template:
      observation-enabled: true       # producer spans, and the trace context in each message's headers
    listener:
      observation-enabled: true       # consumer spans that continue the producer's trace
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                       # the broker confirms only once the event is safely stored
      properties:
        enable.idempotence: true      # a retried send can't create a duplicate or reorder within a partition
        max.in.flight.requests.per.connection: 5   # the most idempotence allows while keeping order
        linger.ms: 5                  # wait up to 5 ms to batch sends together
        max.block.ms: 10000           # with Kafka down, fail a send after 10 s instead of 60
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000    # must be >= linger.ms + request.timeout.ms, or the producer won't start
    consumer:
      auto-offset-reset: earliest     # a new consumer group starts from the oldest event Kafka still has
      enable-auto-commit: false       # offsets are committed by the listener container, after processing
  jpa:
    open-in-view: false        # don't hold a DB connection while rendering responses (see T06)
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        default_batch_fetch_size: 50
  ai:
    model:
      embedding:
        text: google-genai
    google:
      genai:
        # From the environment only (.env locally, a secret in deployment), never in a file in git.
        # Without one the client refuses to start, so the default is a placeholder: the app (and CI) start,
        # and a model call fails with Google's invalid-key error, so AI features use their fallback.
        api-key: ${GEMINI_API_KEY:not-set}
        chat:
          model: gemini-flash-lite-latest   # default only; the AI gateway picks the model for each call
        embedding:
          text:
            model: gemini-embedding-001
    retry:
      # The AI gateway owns retries (ADR 0012). Spring AI's own default is 10 attempts with growing pauses,
      # hidden inside one call.
      max-attempts: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring downloads Keycloak's public keys (JWKS) once and caches them, then checks each token's
          # signature, expiry and audience locally: no call to Keycloak per request. The issuer check is a
          # bean in SecurityConfig, so tests (which swap in a test public key) run the exact same checks.
          jwk-set-uri: ${dispatch.oauth.issuer-uri}/protocol/openid-connect/certs
          audiences: dispatch-api
          authorities-claim-name: roles   # flat claim added by the realm's dispatch-api scope
          authority-prefix: ROLE_         # DISPATCHER -> ROLE_DISPATCHER, so hasRole('DISPATCHER') works

dispatch:
  oauth:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dispatch}
  storage:
    # SeaweedFS locally; for Amazon S3 set the endpoint to https://s3.<region>.amazonaws.com, real keys, and
    # create-bucket false (the bucket comes from infrastructure code). Nothing else changes (T15).
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:dispatch-media}
    access-key: ${S3_ACCESS_KEY:dispatch}
    secret-key: ${S3_SECRET_KEY:dispatch-secret}
    create-bucket: ${S3_CREATE_BUCKET:true}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    relay-interval: PT0.5S            # how often the relay looks for new events
    batch-size: 100
    send-timeout: PT35S               # longer than delivery.timeout.ms, so Kafka's own verdict comes first
    partitions: 6                     # locally; production sizes partitions for its consumers
    replicas: 1
  notification:
    consumer-enabled: ${NOTIFICATION_CONSUMER_ENABLED:true}   # also the live-updates listener
    retry:
      initial-interval: PT1S          # then 2 s, 4 s, 8 s; then the dead-letter topic
      max-retries: 4
  mail:
    from: "Dispatch <no-reply@dispatch.local>"
    sender-enabled: ${MAIL_SENDER_ENABLED:true}
    send-interval: PT2S
    batch-size: 20
    max-attempts: 10                  # then the email is marked failed
    first-retry-after: PT30S          # then 1, 2, 4 min ... at most an hour apart
    circuit:
      open-for: PT30S                 # how long the breaker stays open before one trial call
  live:
    connection-timeout: PT30M         # dashboards reconnect after this
  cache:
    technician-profile-ttl: PT10M
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: 100                     # a burst of up to 100 requests per company
    refill-per-minute: 100            # then 100 a minute, added steadily
  sla:
    widen-after: PT2H                 # nobody took it: offer it farther away
    escalate-after: PT6H              # still nobody: tell the company
    widened-radius-km: 40
    check-interval: PT1M
  ai:
    # Numbers from the free-tier limits and measurements in docs/ai-limits.md (step 3.1).
    call-timeout: PT10S               # one HTTP call; successful calls took 1-7 s, failed ones hung 40 s+
    deadline: PT25S                   # a whole feature call: room for one hung call (10 s) and a second model
    attempts-per-model: 2             # one retry on 503/429/timeout, then the next model
    retry-backoff: PT1S               # 1 s, then 2 s (+-25% jitter)
    daily-calls-per-tenant: ${AI_DAILY_CALLS_PER_TENANT:100}   # the free quota is ~500/day, shared by all
    circuit:
      open-for: PT30S
    models:
      # Client-side limits stay below the provider's per-minute quota (15 RPM for both). Prices are list
      # prices in USD per million tokens, assumed from Flash-Lite's published tier; check
      # https://ai.google.dev/gemini-api/docs/pricing before using the cost numbers.
      gemini-flash-lite-latest:
        requests-per-minute: 12
        input-price-per-million: 0.10
        output-price-per-million: 0.40
      gemini-3.1-flash-lite:          # its own quota (15 RPM, 500 a day) and servers: a real second chance
        requests-per-minute: 12
        input-price-per-million: 0.10
        output-price-per-million: 0.40
      gemini-embedding-001:           # quota 100 a minute and 1,000 a day, counting each text in a batch
        requests-per-minute: 90       # texts, not calls
        input-price-per-million: 0.15
        output-price-per-million: 0
    features:
      skill-suggestions: [gemini-flash-lite-latest, gemini-3.1-flash-lite]
      intake: [gemini-flash-lite-latest, gemini-3.1-flash-lite]
    embedding:
      model: gemini-embedding-001     # stored with each vector: a new model means re-embedding everyone
      dimensions: 768                 # of 3,072: a quarter of the storage, nearly the same quality (Google's guidance)
    replay:
      mode: ${AI_REPLAY_MODE:off}     # off | record | replay (tests and evals; replay never calls the provider)
      directory: ${AI_REPLAY_DIR:ai-replay}
  matching:
    strategy: hybrid                  # hybrid | tags (the nearest with every required skill, Phase 1)
    pool-size: 200                    # nearest technicians scored per work order
    min-skill-coverage: 0.5           # a candidate has at least half the required skills
    # Relative weights, chosen on the matching eval (evals/results/matching.md): 0.78 precision@5 there. Heavier
    # semantic weights score higher on that eval (0.87 at 0.6) but would let travel distance stop mattering.
    weights:
      semantic: 0.5
      skills: 0.2
      distance: 0.15
      rating: 0.1
      reliability: 0.05
    backfill:
      interval: PT65S                 # one batch per round, so at most 90 texts a minute
      batch-size: 90
      daily-limit: 900                # of the free tier's 1,000 a day, leaving room for work orders
  instance-name: ${INSTANCE_NAME:${HOSTNAME:local}}   # in logs, to see which instance did what
  web:
    base-url: ${WEB_BASE_URL:http://localhost:5173}   # the dashboard, for links in emails

springdoc:
  default-produces-media-type: application/json   # not */*: every endpoint returns JSON
  swagger-ui:
    operations-sorter: alpha   # by path, so /work-orders/{id}/... actions sit together under the resource
    oauth:
      client-id: dispatch-web
      use-pkce-with-authorization-code-grant: true

management:
  # Observability (step 2.7, T25): metrics and traces over OTLP to Grafana's LGTM stack (compose: lgtm).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # every request locally; production samples a share
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s                     # how often metrics are pushed
        base-time-unit: seconds       # durations in seconds, as Prometheus expects
  metrics:
    distribution:
      # Latency as a histogram, so p50/p95/p99 can be computed over any window and across instances.
      # Averages hide the slow tail; percentiles show it.
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true   # consumer processing time
        spring.kafka.template: true   # producer send time
      # Exact bucket at the accept SLO (300 ms): "share of requests under 300 ms" is one bucket over the count.
      slo:
        http.server.requests: 100ms,300ms,1s
  health:
    redis:
      # Off for the same reason: Redis only speeds things up (cache) and protects (rate limit); without it the
      # app still serves every request.
      enabled: false
    mail:
      # Off on purpose: emails are queued and sent later, so a mail server outage must not mark the app
      # unhealthy (a load balancer would take it out of service for something users don't notice).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,modulith,metrics   # all but health need a token
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness for Kubernetes later
      group:
        readiness:
          # Not ready without the database: the load balancer stops sending traffic here. Liveness leaves
          # it out on purpose: restarting the app doesn't bring a database back.
          include: readinessState,db

logging:
  level:
    # Telemetry export failures log a full stack trace every few seconds while the observability stack is down,
    # burying the app's own logs. An outage there shows as a gap in Grafana instead (docs/failure-modes.md).
    io.micrometer.registry.otlp.OtlpMeterRegistry: "off"
    io.opentelemetry.exporter.internal.http.HttpExporter: "off"
