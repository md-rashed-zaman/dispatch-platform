spring:
  application:
    name: dispatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dispatch}
    # Not the owner or a superuser, so row-level security applies to every query the app runs (ADR 0003).
    # Migration V4 creates this role; the app refuses to start as a role that bypasses the policies.
    username: dispatch_app
    password: ${DB_APP_PASSWORD:dispatch_app}
    hikari:
      # Wait at most 3 s for a connection, not the default 30: with the database down, requests fail fast with
      # 503 instead of piling up until every web thread is stuck (docs/failure-modes.md).
      connection-timeout: 3000
  flyway:
    # Migrations run as the schema owner. Only Flyway uses this account, never the app's own queries.
    user: ${POSTGRES_USER:dispatch}
    password: ${POSTGRES_PASSWORD:dispatch}
    placeholders:
      app-password: ${spring.datasource.password}
  modulith:
    events:
      # Events whose listener failed or never finished (crash, deploy) are delivered again on startup.
      # Every instance does this, so listeners must be safe to run twice (T16).
      republish-outstanding-events-on-restart: true
  jpa:
    open-in-view: false        # don't hold a DB connection while rendering responses (see T06)
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        default_batch_fetch_size: 50
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring downloads Keycloak's public keys (JWKS) once and caches them, then checks each token's
          # signature, expiry and audience locally: no call to Keycloak per request. The issuer check is a
          # bean in SecurityConfig, so tests (which swap in a test public key) run the exact same checks.
          jwk-set-uri: ${dispatch.oauth.issuer-uri}/protocol/openid-connect/certs
          audiences: dispatch-api
          authorities-claim-name: roles   # flat claim added by the realm's dispatch-api scope
          authority-prefix: ROLE_         # DISPATCHER -> ROLE_DISPATCHER, so hasRole('DISPATCHER') works

dispatch:
  oauth:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dispatch}
  storage:
    # SeaweedFS locally; for Amazon S3 set the endpoint to https://s3.<region>.amazonaws.com, real keys, and
    # create-bucket false (the bucket comes from infrastructure code). Nothing else changes (T15).
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:dispatch-media}
    access-key: ${S3_ACCESS_KEY:dispatch}
    secret-key: ${S3_SECRET_KEY:dispatch-secret}
    create-bucket: ${S3_CREATE_BUCKET:true}

springdoc:
  default-produces-media-type: application/json   # not */*: every endpoint returns JSON
  swagger-ui:
    operations-sorter: alpha   # by path, so /work-orders/{id}/... actions sit together under the resource
    oauth:
      client-id: dispatch-web
      use-pkce-with-authorization-code-grant: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness for Kubernetes later
      group:
        readiness:
          # Not ready without the database: the load balancer stops sending traffic here. Liveness leaves
          # it out on purpose: restarting the app doesn't bring a database back.
          include: readinessState,db
