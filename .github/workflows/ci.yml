name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run from the Actions tab, e.g. after a GitHub outage drops a run
  workflow_dispatch:

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testcontainers starts this image, the same one docker compose uses locally
      - name: Build Postgres image
        run: docker build -t dispatch-postgres:local infra/compose/postgres

      # Formatting check (Spotless), tests, modularity check, coverage report
      - name: Verify
        working-directory: app
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: app/target/site/jacoco/
          if-no-files-found: ignore
