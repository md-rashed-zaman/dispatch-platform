name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run from the Actions tab, e.g. after a GitHub outage drops a run
  workflow_dispatch:

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testcontainers starts this image, the same one docker compose uses locally
      - name: Build Postgres image
        run: docker build -t dispatch-postgres:local infra/compose/postgres

      # Formatting check (Spotless), tests, modularity check, coverage report
      - name: Verify
        working-directory: app
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: app/target/site/jacoco/
          if-no-files-found: ignore

  # The container image for amd64 and arm64 (step 5.1). The jar is built once, natively; only the image's
  # packaging runs per platform (QEMU for arm64), since a jar is the same on every CPU. Pushed nowhere yet (5.4).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package the jar
        working-directory: app
        run: ./mvnw -B -ntp -DskipTests package

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}

      # A multi-platform build can't be loaded into the local Docker, so check the amd64 one separately: the
      # trimmed Java runtime starts, and the image runs as the non-root user.
      - name: Build amd64 and load it
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: dispatch-app:ci
      - name: Check the image
        run: |
          docker run --rm --entrypoint java dispatch-app:ci -version
          test "$(docker image inspect dispatch-app:ci --format '{{.Config.User}}')" = "65532:65532"
          docker image ls dispatch-app:ci

  # The dispatcher web app: type check and production build
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        run: npm run build
